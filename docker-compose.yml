services:
  # --- 1. Base de Données (Nom du service : db) ---
  db:
    image: postgres:15
    container_name: p6_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_secure
      POSTGRES_DB: biopsie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- 2. Stockage Images (Nom du service : minio) ---
  minio:
    image: minio/minio
    container_name: p6_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  # --- 3. Backend API (Nom du service : backend) ---
  backend:
    build: ./backend
    container_name: p6_backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    environment:
      # Ici on utilise "db" car c'est le nom du service ligne 3
      DATABASE_URL: postgresql://admin:password_secure@db:5432/biopsie_db
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - app_network

  # --- 4. Frontend React (Nom du service : frontend) ---
  frontend:
    build: ./frontend
    container_name: p6_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app_network

volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge