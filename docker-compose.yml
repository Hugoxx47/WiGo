version: '3.8'

services:
  # --- Database ---
  postgres:
    image: postgres:15
    container_name: p6_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: p6_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- Object Storage (MinIO) ---
  minio:
      image: minio/minio
      container_name: p6_minio
      hostname: minio
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      volumes:
        - minio_data:/data
      command: server /data --console-address ":9001"
      networks:
        app_network:
          aliases:
            - minio

  # --- Backend (Python/FastAPI) ---
  backend:
    build: ./backend
    container_name: p6_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/dzi_data:/app/dzi_data 
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@p6_postgres:5432/p6_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=biopsies
    depends_on:
      - postgres
      - minio
    networks:
      - app_network

  # --- Frontend (React/Vite) ---
  frontend:
    build: ./frontend
    container_name: p6_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - app_network

volumes:
  postgres_data:
  minio_data:

networks:
  app_network:
    driver: bridge