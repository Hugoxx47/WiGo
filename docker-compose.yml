version: '3.8'

services:
  # --- Base de données (Workflows & Patients) ---
  postgres:
    image: postgres:15
    container_name: p6_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_secure
      POSTGRES_DB: biopsie_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # --- Stockage Objet (Images WSI / DZI) ---
  minio:
    image: minio/minio
    container_name: p6_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    volumes:
      - minio_data:/data

  # --- Serveur DICOM (Orthanc) ---
  orthanc:
    image: jodogne/orthanc
    container_name: p6_orthanc
    ports:
      - "4242:4242" # DICOM
      - "8042:8042" # HTTP API
    environment:
      ORTHANC_REGISTERED_AET: ORTHANC
      ORTHANC_NAME: "Orthanc-Projet6"
    volumes:
      - orthanc_storage:/var/lib/orthanc/db

volumes:
  pg_data:
  minio_data:
  orthanc_storage: