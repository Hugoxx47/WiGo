version: '3.8'

services:
  # --- Database ---
  postgres:
    image: postgres:15
    container_name: p6_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: biopsie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # --- PACS Server (Orthanc) ---
  orthanc:
    image: jodogne/orthanc-plugins
    container_name: p6_orthanc
    ports: ["4242:4242", "8042:8042"]
    environment:
      ORTHANC_NAME: "MY_PACS"
      ORTHANC_JSON: |
        { "Name" : "Orthanc", "HttpPort" : 8042, "DicomPort" : 4242, "RemoteAccessAllowed" : true, "AuthenticationEnabled" : false, "HttpServerEnabled" : true, "DicomServerEnabled" : true, "CorsEnabled": true, "CorsAllowCredentials": true, "CorsAllowedOrigins": ["*"] }
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
    networks:
      - app_network

  # --- Backend (Python/FastAPI) ---
  backend:
    build: ./backend
    container_name: p6_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/dzi_data:/app/dzi_data
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - orthanc
    networks:
      - app_network

  # --- Frontend (React/Vite) ---
  frontend:
    build: ./frontend
    container_name: p6_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - app_network

volumes:
  postgres_data:
  orthanc-storage:

networks:
  app_network:
    driver: bridge